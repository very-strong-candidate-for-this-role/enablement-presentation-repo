<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Enablement Workshop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { 
            font-size: 20px; 
            color: #58a6ff; 
            margin-top: 0; 
        }
        .metric {
            background: #21262d; 
            padding: 12px; 
            border-radius: 4px; 
            margin: 15px 0; 
            display: flex; 
            justify-content: space-between;
        }
        .val {
            font-weight: bold; 
            color: #c9d1d9;
        }
        button {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            font-size: 14px;
        }
        button:hover {
            background-color: #388bfd; /* <-- Change hover color to match (#388bfd) */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Workshop Starter Repository</h1>
        <p>Environment status and telemetry check:</p>
        
        <div class="metric">
            <span>Repository Status:</span>
            <span class="val">Clean & Ready</span>
        </div>
        <div class="metric">
            <span>Merge Conflict Probability:</span>
            <span class="val" style="color: #3fb950;">0.0%</span>
        </div>

        <button onclick="triggerSuccess()">Execute Final Merge</button>
        <div id="message" style="margin-top: 15px; font-style: italic; text-align: center; color: #8b949e;"></div>
    </div>

    <script>
        function triggerSuccess() {
            const msg = document.getElementById('message');
            msg.innerHTML = "✓ Successfully merged. Wow, what a great demonstration this is! 🤩";
            msg.style.color = "#3fb950";
        }
    </script>
</body>
</html>
