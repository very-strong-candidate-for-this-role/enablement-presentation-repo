<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Enablement Telemetry Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { 
            font-size: 20px; 
            color: #58a6ff; 
            margin-top: 0; 
        }
        .metric {
            background: #21262d; 
            padding: 12px; 
            border-radius: 4px; 
            margin: 15px 0; 
            display: flex; 
            justify-content: space-between;
        }
        .val {
            font-weight: bold; 
            color: #3fb950;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Candidate Evaluation Telemetry</h1>
        <p>Live metrics from the current presentation environment:</p>
        
        <div class="metric">
            <span>Candidate Competency Index:</span>
            <span class="val">110% (Overflow Error)</span>
        </div>
        <div class="metric">
            <span>Probability of Hiring Success:</span>
            <span class="val">100.0%</span>
        </div>

        <button onclick="triggerSuccess()" style="background-color: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;">Execute Final Merge</button>
        <div id="message" style="margin-top: 15px; font-style: italic; color: #8b949e; text-align: center;"></div>
    </div>

    <script>
        function triggerSuccess() {
            const msg = document.getElementById('message');
            msg.innerHTML = "🎉 SUCCESS: Production override accepted. Offer letter dispatched.";
            msg.style.color = "#3fb950";
        }
    </script>
</body>
</html>
